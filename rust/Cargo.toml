[package]
name = "sitefile"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Docker-inspired static artifact builder (Rust port of the TypeScript reference implementation)"
license = "MIT"
publish = false

[lib]
name = "sitefile"
path = "src/lib.rs"

[[bin]]
name = "sitefile"
path = "src/main.rs"

# Dependency rationale (AGENTS.md asks for one): the TypeScript version leans on
# Node's standard library (zlib, crypto, http, https, worker WebAssembly). Rust's
# std has none of those, so these crates stand in for them:
#   serde/serde_json  JSON data, plugin and OCI documents (preserve_order keeps
#                     JS object key order, which output can depend on)
#   sha2, base64      digests and plugin payloads
#   flate2            gzip/deflate *decompression* (archive imports, pulled
#                     layers); writing uses src/deflate.rs, which must match
#                     the TypeScript encoder byte for byte
#   ureq              blocking HTTPS client with a pluggable resolver, so the
#                     SSRF address check happens at connect time
#   webpki-roots      the Mozilla root set ureq already uses by default; named
#                     directly so an extra CA (FetchPolicy.ca) is added to
#                     exactly those roots (same version as ureq 2's, one copy)
#   wasmtime          WebAssembly plugins (fuel-limited, no imports)
#   icu_normalizer    Unicode NFC for paths (String.prototype.normalize in
#                     TypeScript). Already in the build through ureq -> url ->
#                     idna -> idna_adapter, same version and features, so it
#                     adds no crate; see docs/RUST.md, "Unicode paths"
# The language server (src/lsp, `sitefile lsp`) adds none: LSP framing is
# hand-rolled and messages are serde_json values (lsp-types would add types
# for a handful of messages; no async runtime, the loop is single-threaded).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.10", features = ["asm"] }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
webpki-roots = "0.26"
wasmtime = { version = "29", default-features = false, features = ["cranelift", "runtime", "std"] }
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
