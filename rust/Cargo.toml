[package]
name = "sitefile"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Docker-inspired static artifact builder (Rust port of the TypeScript reference implementation)"
license = "MIT"
publish = false

[lib]
name = "sitefile"
path = "src/lib.rs"

[[bin]]
name = "sitefile"
path = "src/main.rs"

# Dependency rationale (AGENTS.md asks for one): the TypeScript version leans on
# Node's standard library (zlib, crypto, http, https, worker WebAssembly). Rust's
# std has none of those, so these crates stand in for them:
#   serde/serde_json  JSON data, plugin and OCI documents (preserve_order keeps
#                     JS object key order, which output can depend on)
#   sha2, base64      digests and plugin payloads
#   flate2            gzip/deflate *decompression* (archive imports, pulled
#                     layers); writing uses src/deflate.rs, which must match
#                     the TypeScript encoder byte for byte
#   ureq              blocking HTTPS client with a pluggable resolver, so the
#                     SSRF address check happens at connect time
#   webpki-roots      the Mozilla root set ureq already uses by default; named
#                     directly so an extra CA (FetchPolicy.ca) is added to
#                     exactly those roots (same version as ureq 2's, one copy)
#   wasmtime          WebAssembly plugins (fuel-limited, no imports)
#   ring              Ed25519 signing for `EXPORT … AS swbn` (constant time; already in the
#                     build through ureq -> rustls, same version, so it adds no crate)
#   icu_normalizer    Unicode NFC for paths (String.prototype.normalize in
#                     TypeScript). Already in the build through ureq -> url ->
#                     idna -> idna_adapter, same version and features, so it
#                     adds no crate; see docs/RUST.md, "Unicode paths"
#   rustls            `serve --tls-cert/--tls-key` (HTTPS; node:https in
#                     TypeScript). Already in the build through ureq, named
#                     with exactly ureq's version and features (ring, no
#                     aws-lc), so it adds no crate
#   bcrypt            EksBlowfish for bcrypt entries in `serve --auth-file`
#                     (#278; src/bcrypt.ts in TypeScript, which has no
#                     Blowfish in node:crypto). Only its raw `bcrypt()` is
#                     used: parsing, the 72-byte key and the constant-time
#                     compare are in src/bcrypt_verify.rs, as in TypeScript.
#                     No default features (no getrandom, no zeroize). Brings
#                     blowfish, cipher, subtle and base64 0.23. Approved by
#                     the owner (John) on 2026-11-09 as a new dependency
#   ruzstd            zstd *decompression* for `.tar.zst` imports and serve
#                     (#221; node:zlib's zstdDecompress in TypeScript). Pure
#                     Rust, decode only; brings twox-hash for frame checksums.
#                     Approved by the owner (John) on 2026-11-09 as a new
#                     dependency. Locked at 0.8.1: 0.8.3 and later declare
#                     rust-version 1.87, above ours (1.85)
# Vendored C code (no crate): `PRECOMPRESS br` (#203) compiles Google's Brotli
# encoder from vendor/brotli (v1.2.0, the version Node 26 bundles, MIT) with
# build.rs and the `cc` build-dependency, so the Rust port writes the same .br
# bytes as node:zlib (the pure-Rust `brotli` crate differs from libbrotli 1.2.0
# at every quality but 0; docs/RUST.md, "Compression"). This makes a C compiler
# a build requirement (ring needs one already). Approved by the owner (John) on
# 2026-11-09.
# The language server (src/lsp, `sitefile lsp`) adds none: LSP framing is
# hand-rolled and messages are serde_json values (lsp-types would add types
# for a handful of messages; no async runtime, the loop is single-threaded).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.10", features = ["asm"] }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
webpki-roots = "0.26"
wasmtime = { version = "29", default-features = false, features = ["cranelift", "runtime", "std"] }
ring = { version = "0.17", default-features = false }
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
bcrypt = { version = "0.19", default-features = false }
ruzstd = "0.8"

[build-dependencies]
# Compiles the vendored C Brotli encoder (vendor/brotli; see the rationale above).
# Already in the build through ring, same version, so it adds no crate.
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
