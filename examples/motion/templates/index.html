<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${TITLE}</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #0b1020; color: #f5f7ff; }
  main { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
  img { width: 100%; height: auto; border-radius: 12px; display: block; }
  .cards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <img src="/title.svg" alt="${TITLE}">
  <div class="cards">
${#each posts as post}    <img src="/cards/${post.slug}.svg" alt="${post.title}">
${/each}  </div>
</main>
</body>
</html>
