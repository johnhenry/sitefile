<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive images</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  img { max-width: 100%; height: auto; }
  code { background: #f1f5f9; padding: 0 .25em; }
</style>
</head>
<body>
<h1><picture>
  <source type="image/webp" srcset="/img/badge-64.webp 1x, /img/badge-128.webp 2x">
  <img src="/img/badge-64.png" srcset="/img/badge-64.png 1x, /img/badge-128.png 2x" width="64" height="64" alt="">
</picture> Responsive images</h1>
<img src="/img/sky-1200.jpg" srcset="/img/sky-400.jpg 400w, /img/sky-800.jpg 800w, /img/sky-1200.jpg 1200w" sizes="(min-width: 52rem) 50rem, 100vw" width="1200" height="750" alt="A colorful sky">
<p>Every size above was made by the image plugin at build time. The widths,
heights and <code>srcset</code> strings are also in
<a href="/img/sky.json"><code>/img/sky.json</code></a> and
<a href="/img/badge.json"><code>/img/badge.json</code></a>; templates can't read
those files yet, so this page writes them out (the <code>img</code> template
helper of issue #105 will read them).</p>
<p><img src="/img/sky-thumb.png" width="160" height="100" alt="A thumbnail of the same sky"></p>
</body>
</html>
