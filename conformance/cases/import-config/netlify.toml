# Netlify (issue #204 fixture)
[build]
  publish = "dist"

[[redirects]]
  from = "/old"
  to = "/new"

[[redirects]]
  from = "/blog/*"
  to = "https://blog.example.com/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/news/:year/:slug"
  to = "/articles/:year/:slug"

[[redirects]]
  from = "/fr/*"
  to = "/fr/index.html"
  status = 200
  conditions = { Language = ["fr"] }

[[redirects]]
  from = "/gone"
  to = "/"
  status = 410

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Link = ["</a.css>; rel=preload", "</b.js>; rel=preload"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = 'public, max-age=31536000, immutable'
