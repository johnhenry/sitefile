id = "sitefile"
name = "Sitefile"
description = "Syntax highlighting and language server support for Sitefile, the Docker-inspired static site builder."
version = "0.2.0"
schema_version = 1
authors = ["John Henry <john@iamjohnhenry.com>"]
repository = "https://github.com/johnhenry/sitefile"

# The grammar lives in this repository at editors/tree-sitter-sitefile. `rev`
# must be a commit that contains it; update it (to a commit on main) whenever
# the grammar changes. For local development see README.md.
[grammars.sitefile]
repository = "https://github.com/johnhenry/sitefile"
rev = "bb194aff34a3479a36eec2439165006342eba783"
path = "editors/tree-sitter-sitefile"

# `sitefile lsp` from the Rust binary (docs/LSP.md). src/lib.rs finds
# `sitefile` on PATH, or uses lsp.sitefile-lsp.binary.path from the settings.
[language_servers.sitefile-lsp]
name = "Sitefile LSP"
languages = ["Sitefile"]
